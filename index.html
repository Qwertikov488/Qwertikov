<!DOCTYPE html>
<html>
<head>
    <title>Мой сайт</title>
    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- ПЕРВЫЙ ЭКРАН -->
<div id="screen1">
    <h1>Добро пожаловать 👋</h1>
    <p>Хотите перейти на основной сайт?</p>
    <button onclick="goNext()">Да</button>
</div>

<!-- ВТОРОЙ ЭКРАН -->
<div id="screen2" style="display:none;">
    <h1>Илон Маск 🚀</h1>
    <p>Илон Маск — предприниматель и инженер.</p>
    <p>Он основал компанию SpaceX.</p>
    <p>SpaceX делает ракеты и запускает их в космос.</p>
</div>

<script>
function goNext() {
    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "block";
}
</script>

</body>
</html>
