<!DOCTYPE html>
<html>
<head>
    <title>Apple Style</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, Arial;
            background: #111;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            transition: 0.6s;
        }

        /* ===== ЭКРАН 1 ===== */
        #screen1 {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .image-box {
            width: 80%;
            max-width: 900px;
            height: 500px;
            background-image: url('https://i.pinimg.com/1200x/39/06/69/3906691596a7fd6daa6ed75a98669338.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
        }

        h1 {
            color: white;
            z-index: 1;
            font-size: 40px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: white;
            cursor: pointer;
        }

        /* ===== ЭКРАН 2 ===== */
        #screen2 {
            background: #000;
            transform: translateX(100%);
            padding: 0;
            box-sizing: border-box;
            color: white;
        }

        /* HERO */
        .hero {
            width: 100%;
            height: 100vh;
            background-image: url('https://i.pinimg.com/736x/77/42/cb/7742cbbfe0070484d1dd981ad54ab3a8.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
        }

        .hero h2 {
            position: relative;
            font-size: 60px;
            z-index: 1;
            margin: 0;
        }

        /* MENU BUTTON */
        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            background: white;
            color: black;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #111;
            padding: 20px;
            transition: 0.4s;
            z-index: 3;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 15px 0;
            font-size: 18px;
        }

    </style>
</head>

<body>

<!-- ЭКРАН 1 -->
<div id="screen1" class="screen">

    <div class="image-box">
        <div class="overlay"></div>
        <h1>Добро пожаловать</h1>
    </div>

    <button onclick="next()">Перейти</button>

</div>

<!-- ЭКРАН 2 -->
<div id="screen2" class="screen">

    <!-- кнопка меню -->
    <div class="menu-btn" onclick="toggleMenu()">Меню</div>

    <!-- sidebar -->
    <div id="sidebar" class="sidebar">
        <a href="#">Главная</a>
        <a href="#">Проекты</a>
        <a href="#">Новости</a>
        <a href="#">Контакты</a>
    </div>

    <!-- главный экран -->
    <div class="hero">
        <h2>SpaceX</h2>
    </div>

</div>

<script>
function next() {
    document.getElementById("screen1").style.transform = "translateX(-100%)";
    document.getElementById("screen2").style.transform = "translateX(0)";
}

function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
