<!DOCTYPE html>
<html>
<head>
    <title>Apple Style</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, Arial;
            background: #111;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            transition: 0.6s;
        }

        /* ===== ЭКРАН 1 ===== */
        #screen1 {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .image-box {
            width: 80%;
            max-width: 900px;
            height: 500px;
            background-image: url('https://i.pinimg.com/1200x/39/06/69/3906691596a7fd6daa6ed75a98669338.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
        }

        h1 {
            color: white;
            z-index: 1;
            font-size: 40px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: white;
            cursor: pointer;
        }

        /* ===== ЭКРАН 2 ===== */
        #screen2 {
            background: #f5f5f7;
            transform: translateX(100%);
            padding: 40px;
            box-sizing: border-box;
        }

        /* HEADER */
        .header {
            height: 60px;
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* БЛОКИ */
        .container {
            display: flex;
            gap: 20px;
        }

        .left {
            width: 70%;
        }

        .right {
            width: 30%;
        }

        .block {
            height: 120px;
            background: white;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .big {
            height: 200px;
        }

    </style>
</head>

<body>

<!-- ЭКРАН 1 -->
<div id="screen1" class="screen">

    <div class="image-box">
        <div class="overlay"></div>
        <h1>Добро пожаловать</h1>
    </div>

    <button onclick="next()">Перейти</button>

</div>

<!-- ЭКРАН 2 -->
<div id="screen2" class="screen">

    <div class="header"></div>

    <div class="container">
        <div class="left">
            <div class="block big"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>

        <div class="right">
            <div class="block"></div>
            <div class="block"></div>
        </div>
    </div>

</div>

<script>
function next() {
    document.getElementById("screen1").style.transform = "translateX(-100%)";
    document.getElementById("screen2").style.transform = "translateX(0)";
}
</script>

</body>
</html>
