<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceX Style Template</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #fff;
    background: #000;
}

/* NAV */
nav {
    position: fixed;
    width: 100%;
    top: 0;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

nav .logo {
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
}

nav .menu a {
    margin-left: 30px;
    text-decoration: none;
    color: #aaa;
    transition: 0.3s;
}

nav .menu a:hover {
    color: #fff;
}

/* SECTION BASE */
.section {
    height: 100vh;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 80px;
}

/* BACKGROUND IMAGE */
.bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 1;
}

/* DARK OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2));
    z-index: 2;
}

/* CONTENT */
.content {
    position: relative;
    z-index: 3;
    max-width: 500px;
}

.content h1 {
    font-size: 50px;
    margin-bottom: 10px;
}

.content p {
    color: #ccc;
    margin-bottom: 20px;
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 12px 30px;
    border: 2px solid #fff;
    text-decoration: none;
    color: #fff;
    transition: 0.3s;
}

.btn:hover {
    background: #fff;
    color: #000;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="logo">SPACEX</div>
    <div class="menu">
        <a href="#">Falcon 9</a>
        <a href="#">Starship</a>
        <a href="#">Missions</a>
    </div>
</nav>

<!-- SECTION 1 -->
<div class="section">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa');"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1>FALCON 9</h1>
        <p>First orbital class reusable rocket.</p>
        <a href="#" class="btn">LEARN MORE</a>
    </div>
</div>

<!-- SECTION 2 -->
<div class="section">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1451187580459-43490279c0fa');"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1>STARSHIP</h1>
        <p>Designed for missions to Mars and beyond.</p>
        <a href="#" class="btn">VIEW PROJECT</a>
    </div>
</div>

<!-- SECTION 3 -->
<div class="section">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564');"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1>MISSION</h1>
        <p>Making life multiplanetary.</p>
        <a href="#" class="btn">EXPLORE</a>
    </div>
</div>

<!-- SECTION 4 -->
<div class="section">
    <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1446776653964-20c1d3a81b06');"></div>
    <div class="overlay"></div>

    <div class="content">
        <h1>FUTURE</h1>
        <p>Humanity beyond Earth.</p>
        <a href="#" class="btn">DISCOVER</a>
    </div>
</div>

</body>
</html>
